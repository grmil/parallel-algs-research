name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels whatever CI run was already in
# progress for it - avoids burning time on a run that's already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # clang-format
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          files=$(find src include tests examples \
            -type f \( -name '*.cpp' -o -name '*.h' \))
          clang-format --dry-run --Werror $files

  # clang-tidy
  tidy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_COMPILER=clang++

      - name: Run clang-tidy
        run: |
          files=$(find src include \
            -type f \( -name '*.cpp' -o -name '*.h' \))
          clang-tidy -p build $files
